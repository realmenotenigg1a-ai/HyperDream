name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already provides Android SDK command-line tools.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then
            echo "::error title=Android SDK unavailable::Expected sdkmanager at $SDK_MANAGER on the ubuntu-latest runner."
            exit 1
          fi
          if ! "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" > sdk-setup.log 2>&1; then
            cat sdk-setup.log
            MESSAGE=$(tail -n 15 sdk-setup.log | tr '\n' ' ')
            echo "::error title=Android SDK setup failed::${MESSAGE//'%'/'%25'}"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Surface test and lint failures
        if: failure()
        run: python3 .github/scripts/report_failures.py
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: HyperDream-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
